<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Carbon Emission Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a5435 0%, #2c7a4b 60%, #4caf50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header .logo { font-size: 3rem; }
        .login-header h1 {
            color: #fff;
            font-size: 1.6rem;
            margin-top: 8px;
        }
        .login-header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 36px 32px;
        }
        .login-card h2 {
            color: #2c7a4b;
            font-size: 1.3rem;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2c7a4b;
            box-shadow: 0 0 0 3px rgba(44,122,75,0.15);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2c7a4b;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn-login:hover { background: #1a5435; }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .demo-box {
            margin-top: 24px;
            background: #e8f5ee;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 14px 16px;
        }
        .demo-box p {
            color: #155724;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .demo-box .credentials {
            display: flex;
            gap: 16px;
        }
        .demo-box .credential-item {
            display: flex;
            flex-direction: column;
        }
        .demo-box .credential-label {
            font-size: 0.75rem;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .demo-box .credential-value {
            font-size: 0.9rem;
            color: #1a5435;
            font-weight: 700;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-header">
        <div class="logo">🌿</div>
        <h1>Carbon Emission Calculator</h1>
        <p>Track and reduce your carbon footprint</p>
    </div>
    <div class="login-card">
        <h2>Sign In</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="demo-box">
            <p>🔑 Demo Credentials</p>
            <div class="credentials">
                <div class="credential-item">
                    <span class="credential-label">Username</span>
                    <span class="credential-value">admin</span>
                </div>
                <div class="credential-item">
                    <span class="credential-label">Password</span>
                    <span class="credential-value">admin123</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
